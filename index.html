<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f6f1e7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="合成大奶蛙" />
<meta name="format-detection" content="telephone=no" />
<title>合成大奶蛙 · 梗合成</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='11' fill='%23ffd43b'/%3E%3Ccircle cx='12.5' cy='15' r='2' fill='%23332b16'/%3E%3Ccircle cx='19.5' cy='15' r='2' fill='%23332b16'/%3E%3Cpath d='M12 21q4 3.5 8 0' stroke='%23332b16' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="top-left">
      <div class="score" id="score">0</div>
      <div class="combo" id="combo"></div>
    </div>
    <div class="top-right">
      <div class="best">最高分 <b id="best">0</b></div>
      <button class="icon-btn" id="bitsBtn" type="button" aria-label="梗图鉴">图鉴</button>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="音效开关">🔊</button>
    </div>
    <div class="next-card" id="nextCard" title="点击交换当前的梗">
      <div class="next-label">下一个</div>
      <div class="next-name" id="nextName">奶龙</div>
      <div class="next-hint">点我交换</div>
    </div>
    <div class="banner" id="banner"></div>
    <div class="hint" id="hint">移动鼠标选位置 · 点击 / 空格投放</div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="panel">
      <div class="logo">合成大奶蛙</div>
      <p class="sub">两个一样的梗挨在一起就会合成更癫的那个</p>
      <ul class="tips">
        <li><span>1</span>移动鼠标 / 手指选位置，点击或空格投放</li>
        <li><span>2</span>同样的梗贴在一起就合成升级，连锁合成有连击加成</li>
        <li><span>3</span>两个<b>飞天奶龙</b>合成<b>湮灭</b>，直接暴力清屏</li>
        <li><span>4</span>堆到红线以上超过 1.5 秒就结束</li>
      </ul>
      <button class="btn primary" id="startBtn" type="button">开始合成</button>
      <div class="foot">最高分 <b id="best2">0</b> · 按 S 交换当前梗</div>
    </div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="panel">
      <div class="over-title" id="overTitle">堆满了</div>
      <div class="result"><span id="finalScore">0</span><small>分</small></div>
      <div class="best-row">最高分 <b id="best3">0</b><span class="new-record hidden" id="newRecord">新纪录</span></div>
      <button class="btn primary" id="againBtn" type="button">再来一局</button>
      <div class="foot">按 R 键快速重开</div>
    </div>
  </div>

  <div class="overlay hidden" id="bitsScreen">
    <div class="panel wide">
      <div class="over-title">梗图鉴</div>
      <div class="sub small">合成过就会点亮（进度存在本地）</div>
      <div class="bits" id="bitsList"></div>
      <button class="btn primary" id="bitsClose" type="button">继续合成</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
